# ph2 -- edit the four paths, everything else matches the manuscript
train_images: data/ph2/train/images
train_masks:  data/ph2/train/masks
test_images:  data/ph2/test/images
test_masks:   data/ph2/test/masks
train_index:  splits/ph2_train.txt   # explicit split, not a shuffle seed
test_index:   splits/ph2_test.txt

size: 256
batch_size: 8
epochs: 300
lr: 1.0e-4
lr_min: 1.0e-6
weight_decay: 1.0e-4
workers: 4
eval_every: 10

# architecture
encoder: lrre
bridge: web
fusion: evidential
wavelet: db5
levels: 2
use_tar: true
widths: [16, 32, 64, 96]
decoder_out: 24
tar_hidden: 24
tar_stride: 4        # yields 0.185 GFLOPs, matching the manuscript's 0.184

# composite loss
lambda_bce: 1.0
lambda_dice: 1.0
lambda_ev: 0.1
lambda_topo: 0.1
topo_size: 64        # persistence is computed on a 64x64 downsample for speed
topo_every: 1
